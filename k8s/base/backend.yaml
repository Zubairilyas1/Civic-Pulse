apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: civicpulse
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        # Schema migrations run before any replica serves traffic. Alembic's
        # upgrade is idempotent, so concurrent replicas converge on the same head.
        - name: migrate
          image: ghcr.io/zubairilyas1/civicpulse-backend:v0.0.0
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: civicpulse-config
            - secretRef:
                name: civicpulse-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      containers:
        - name: backend
          image: ghcr.io/zubairilyas1/civicpulse-backend:v0.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: civicpulse-config
            - secretRef:
                name: civicpulse-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            # Slow cold starts (image pull, migration init, Redis warm-up) must not
            # race liveness: kubelet allows 30 x 2s = 60s before liveness starts.
            httpGet:
              path: /api/health
              port: 8000
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: civicpulse
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: backend
