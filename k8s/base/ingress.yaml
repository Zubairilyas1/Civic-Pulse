apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civicpulse-ingress
  namespace: civicpulse
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  # Bind to ingress-nginx specifically: without a class, whichever controller
  # happens to run in a cluster (Traefik in k3s, nginx, ...) would claim it.
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
