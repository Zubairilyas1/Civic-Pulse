name: CI Pipeline

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

permissions:
  contents: read
  packages: read

jobs:
  lint-and-type:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff Linter
        run: ruff check backend/

      - name: Run MyPy Type Checker
        run: mypy backend/app --ignore-missing-imports

  test-backend:
    name: Test Backend & Coverage
    runs-on: ubuntu-latest
    env:
      TRIAGE_PROVIDER: simulated
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/civicpulse_test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-cov httpx

      - name: Run Pytest Suite
        run: |
          pytest backend/tests -v --cov=backend/app --cov-report=term-missing

  build-backend-image:
    name: Build Backend Container
    runs-on: ubuntu-latest
    needs: [lint-and-type, test-backend]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: civicpulse-backend:ci-${{ github.sha }}

  security-scan:
    name: Security Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [build-backend-image]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
