name: CI Pipeline

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

permissions:
  contents: read
  packages: read

jobs:
  lint-and-type:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff Linter
        run: ruff check backend/

      - name: Run MyPy Type Checker
        run: mypy backend/app --ignore-missing-imports

  test-backend:
    name: Test Backend & Coverage
    runs-on: ubuntu-latest
    env:
      TRIAGE_PROVIDER: simulated
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/civicpulse_test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-cov httpx

      - name: Run Pytest Suite
        run: |
          pytest backend/tests -v --cov=backend/app --cov-report=term-missing

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build Frontend
        run: npm run build

  build-backend-image:
    name: Build Backend Container
    runs-on: ubuntu-latest
    needs: [lint-and-type, test-backend]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: civicpulse-backend:ci-${{ github.sha }}

  build-frontend-image:
    name: Build Frontend Container
    runs-on: ubuntu-latest
    needs: [test-frontend]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: civicpulse-frontend:ci-${{ github.sha }}

  compose-integration:
    name: Compose Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-and-type, test-backend, test-frontend]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start CivicPulse services
        run: docker compose up --build --detach db redis backend frontend

      - name: Wait for API readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:8000/api/ready; then
              exit 0
            fi
            sleep 2
          done
          echo "CivicPulse API did not become ready in time."
          exit 1

      - name: Apply database migrations
        run: docker compose exec --tty=false backend alembic upgrade head

      - name: Verify frontend, complaint flow, and stats cache
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://localhost:3000/ | grep --quiet "CivicPulse"

          complaint="$(curl --fail --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"title":"CI water interruption","description":"There has been no clean water supply in our street since this morning.","location":"Sector G-11 Islamabad"}' \
            http://localhost:3000/api/complaints)"
          complaint_id="$(printf '%s' "$complaint" | python -c 'import json, sys; print(json.load(sys.stdin)["id"])')"

          curl --fail --silent --show-error "http://localhost:3000/api/complaints/${complaint_id}" \
            | python -c 'import json, sys; assert json.load(sys.stdin)["title"] == "CI water interruption"'

          curl --fail --silent --show-error --dump-header stats-first.headers --output /dev/null http://localhost:3000/api/stats
          grep --ignore-case --quiet '^x-cache: MISS' stats-first.headers
          curl --fail --silent --show-error --dump-header stats-second.headers --output /dev/null http://localhost:3000/api/stats
          grep --ignore-case --quiet '^x-cache: HIT' stats-second.headers

      - name: Print Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop CivicPulse services
        if: always()
        run: docker compose down --volumes --remove-orphans

  security-scan:
    name: Security Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [build-backend-image]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
