name: CD Deployment Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Full Test Suite (merged result)
    runs-on: ubuntu-latest
    env:
      TRIAGE_PROVIDER: simulated
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/civicpulse_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: civicpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d civicpulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-cov httpx ruff mypy

      - name: Run Ruff Linter
        run: ruff check backend/

      - name: Run MyPy Type Checker
        run: mypy backend/app --ignore-missing-imports

      - name: Run Pytest Suite with Coverage Gate
        run: |
          pytest backend/tests -v --cov=backend/app --cov-report=term-missing --cov-fail-under=65

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Lint and Type Check
        working-directory: frontend
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

  integration:
    name: Compose Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start CivicPulse services
        run: docker compose up --build --detach db redis backend frontend

      - name: Wait for API readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:8000/api/ready; then
              exit 0
            fi
            sleep 2
          done
          echo "CivicPulse API did not become ready in time."
          exit 1

      - name: Apply database migrations
        run: docker compose exec --tty=false backend alembic upgrade head

      - name: Verify complaint flow and stats cache
        shell: bash
        run: |
          set -euo pipefail
          complaint="$(curl --fail --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"title":"CD water interruption","description":"There has been no clean water supply in our street since this morning.","location":"Sector G-11 Islamabad"}' \
            http://localhost:8000/api/complaints)"
          complaint_id="$(printf '%s' "$complaint" | python -c 'import json, sys; print(json.load(sys.stdin)["id"])')"

          curl --fail --silent --show-error "http://localhost:8000/api/complaints/${complaint_id}" \
            | python -c 'import json, sys; assert json.load(sys.stdin)["title"] == "CD water interruption"'

          curl --fail --silent --show-error --dump-header stats-first.headers --output /dev/null http://localhost:8000/api/stats
          grep --ignore-case --quiet '^x-cache: MISS' stats-first.headers
          curl --fail --silent --show-error --dump-header stats-second.headers --output /dev/null http://localhost:8000/api/stats
          grep --ignore-case --quiet '^x-cache: HIT' stats-second.headers

      - name: Print Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop CivicPulse services
        if: always()
        run: docker compose down --volumes --remove-orphans

  build-and-push-ghcr:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: [test, integration]
    outputs:
      backend-digest: ${{ steps.build-backend.outputs.digest }}
      frontend-digest: ${{ steps.build-frontend.outputs.digest }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Backend Image Metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/civicpulse-backend
          tags: |
            type=raw,value=${{ github.sha }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Extract Frontend Image Metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/civicpulse-frontend
          tags: |
            type=raw,value=${{ github.sha }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Backend Image
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Build and Push Frontend Image
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      - name: Generate Backend SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/civicpulse-backend@${{ steps.build-backend.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-civicpulse-backend.spdx.json

      - name: Generate Frontend SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/civicpulse-frontend@${{ steps.build-frontend.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-civicpulse-frontend.spdx.json

      - name: Publish image digests to job summary
        run: |
          {
            echo "## Published image digests (immutable deploy references)"
            echo ""
            echo "| Image | Digest |"
            echo "| --- | --- |"
            echo "| civicpulse-backend | \`${{ steps.build-backend.outputs.digest }}\` |"
            echo "| civicpulse-frontend | \`${{ steps.build-frontend.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Deployment stage: boot an ephemeral Kubernetes cluster, deploy the prod
  # overlay BY COMMIT SHA (never a mutable tag), roll it out, and smoke-test the
  # Ingress path. This is the run whose URL belongs in submission item 2.
  deploy-k8s:
    name: Deploy to Ephemeral kind Cluster
    runs-on: ubuntu-latest
    needs: [build-and-push-ghcr]
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install kind (pinned release) and create cluster
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/kind "https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64"
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind version
          kind create cluster --name civicpulse --wait 120s

      - name: Log in to GHCR, pull the immutable images, load them into kind
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
          BACKEND="ghcr.io/${{ github.repository_owner }}/civicpulse-backend:${{ github.sha }}"
          FRONTEND="ghcr.io/${{ github.repository_owner }}/civicpulse-frontend:${{ github.sha }}"
          docker pull "${BACKEND}"
          docker pull "${FRONTEND}"
          # Pre-pull the small supporting images too, then load everything at once:
          # kind's containerd pulls nothing from Docker Hub this way (no rate risk).
          docker pull postgres:15-alpine
          docker pull redis:7-alpine
          docker pull curlimages/curl:8.10.1
          kind load docker-image "${BACKEND}" "${FRONTEND}" \
            postgres:15-alpine redis:7-alpine curlimages/curl:8.10.1 \
            --name civicpulse

      - name: Point the prod overlay at this commit's SHA tag
        run: |
          set -euo pipefail
          sed -i "s/newTag: .*/newTag: ${{ github.sha }}/" k8s/overlays/prod/kustomization.yaml
          grep -n "newTag" k8s/overlays/prod/kustomization.yaml

      - name: Install the VPA CRD (manifests ship a VerticalPodAutoscaler object)
        run: |
          set -euo pipefail
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/autoscaler/vertical-pod-autoscaler-1.8.0/vertical-pod-autoscaler/deploy/vpa-v1-crd-gen.yaml

      - name: Apply manifests and wait for every rollout
        run: |
          set -euo pipefail
          kubectl apply -k k8s/overlays/prod
          kubectl -n civicpulse-prod rollout status statefulset/postgres --timeout=180s
          kubectl -n civicpulse-prod rollout status deployment/redis --timeout=180s
          kubectl -n civicpulse-prod rollout status deployment/backend --timeout=180s
          kubectl -n civicpulse-prod rollout status deployment/frontend --timeout=180s
          kubectl -n civicpulse-prod get pods -o wide

      - name: Install ingress-nginx for the Ingress smoke test
        run: |
          set -euo pipefail
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          helm install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx --create-namespace \
            --set controller.service.type=ClusterIP \
            --wait --timeout 180s

      - name: Smoke test Ingress -> frontend and Ingress -> backend
        run: |
          set -euo pipefail
          # /api is routed to the backend Service, / to the frontend Service.
          # --command replaces the image's curl ENTRYPOINT so `sh -c` runs.
          kubectl run civicpulse-smoke --rm -i --restart=Never --image=curlimages/curl:8.10.1 \
            --command -- sh -c '
              curl --fail --silent --show-error --max-time 10 \
                http://ingress-nginx-controller.ingress-nginx.svc.cluster.local/api/ready &&
              echo &&
              curl --fail --silent --show-error --max-time 10 -o /dev/null \
                http://ingress-nginx-controller.ingress-nginx.svc.cluster.local/'

      - name: Show HPA and workloads (job summary)
        run: |
          set -euo pipefail
          kubectl -n civicpulse-prod get hpa
          kubectl -n civicpulse-prod get all
          {
            echo "## Ephemeral cluster deploy"
            echo ""
            echo '```'
            kubectl -n civicpulse-prod get hpa
            kubectl -n civicpulse-prod get pods
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          kubectl -n civicpulse-prod describe pods || true
          kubectl -n civicpulse-prod logs deployment/backend --tail=200 || true
          kubectl -n civicpulse-prod logs deployment/frontend --tail=100 || true

      - name: Delete cluster
        if: always()
        run: kind delete cluster --name civicpulse || true
