name: Release Validation

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Validate semantic version tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version tag such as v1.0.0; received '$tag'."
            exit 1
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

  verify-frontend:
    name: Verify Frontend Release Build
    runs-on: ubuntu-latest
    needs: validate-tag
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint and Tests
        run: |
          npm run lint
          npm test

      - name: Build Frontend
        run: npm run build

  verify-backend:
    name: Verify Backend Release Build
    runs-on: ubuntu-latest
    needs: validate-tag
    env:
      TRIAGE_PROVIDER: simulated
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/civicpulse_test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-cov httpx

      - name: Run Pytest Suite
        run: pytest backend/tests -v --cov=backend/app --cov-report=term-missing

  create-draft-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    needs: [validate-tag, verify-frontend, verify-backend]
    permissions:
      contents: write
    steps:
      - name: Create a draft release when one does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release for $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --generate-notes \
            --title "CivicPulse $RELEASE_TAG"
