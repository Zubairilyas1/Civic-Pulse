services:
  # Database Service (PostgreSQL 15)
  db:
    image: postgres:15-alpine
    container_name: civicpulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: civicpulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # WHY a volume: complaint rows are the system of record (§2.1 persists
      # triage output); without it every `down` would erase the database and
      # `up` would boot an empty city. Only `down -v` intentionally wipes it.
    networks:
      - internal
    # NOTE: no published port, on purpose. The spec requires db/cache on `internal` only,
    # and Docker installs no host forward for containers on an internal network anyway.
    # Host-side tools therefore run the test suite inside the stack:
    #   docker compose run --rm backend pytest tests -v
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d civicpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cache Service (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: civicpulse-redis
    restart: unless-stopped
    # AOF (appendonly) on purpose: Redis is now more than a cache — the §2.4
    # rate-limiter counter and the stats cache live here, and an AOF replay on
    # restart means a reboot does not silently reset the 60-requests/minute
    # budget. The cost (one fsync per write window) is negligible at this scale.
    command: redis-server --appendonly yes
    volumes:
      # Named volume so AOF/RDB files survive `docker compose down` (they are
      # wiped only with `down -v`). Loss window without it: the rate-limit
      # budget and cached stats reset on every container recreation.
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:0.3.12
    container_name: civicpulse-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
      # WHY a volume: model weights (several GB) are pulled once and reused;
      # a fresh container must not re-download them on every restart.
    networks:
      - internal

  # Database migration (one-shot): runs before the backend starts, exits when done.
  # Shares the backend image (same `image:` tag) so both services always ship the
  # same Alembic revision directory — separate implicit images would drift.
  migrate:
    image: no1-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/civicpulse
    restart: "no"
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

  # Data seed (one-shot, MANUAL — never part of `docker compose up`): loads the 32
  # canonical demo complaints. Fresh environments and CI stay empty on purpose so
  # tests never depend on seed rows; run it explicitly with:
  #   docker compose run --rm seed
  # The `tools` profile keeps it out of `docker compose up` (compose enables a
  # service's profile automatically when you `run` that service directly).
  # Idempotent by title: a second run inserts 0 rows and leaves the same 32.
  seed:
    profiles: ["tools"]
    image: no1-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "/scripts/seed.py"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/civicpulse
    volumes:
      - ./scripts:/scripts:ro
    restart: "no"
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Backend API Service (FastAPI)
  backend:
    image: no1-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicpulse-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/civicpulse
      REDIS_URL: redis://redis:6379/0
      TRIAGE_PROVIDER: ${TRIAGE_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_HOST: http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      # DEV ONLY: mount the source so `docker compose run backend pytest ...` sees
      # the local tree (the production image excludes tests, per .dockerignore).
      # compose.prod.yaml uses the baked-in image with no mount.
      - ./backend:/app
    networks:
      - edge
      - internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Frontend Web Service (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicpulse-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - edge
    depends_on:
      - backend

# 2 Isolated Networks: edge (frontend-backend bridge) & internal (isolated DB/Redis/Ollama)
networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

# 3 Persistent Named Volumes
volumes:
  postgres_data:
  redis_data:
  ollama_data:
