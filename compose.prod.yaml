services:
  db:
    image: postgres:15-alpine
    container_name: civicpulse-db-prod
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: civicpulse
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d civicpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: civicpulse-redis-prod
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data_prod:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${IMAGE_TAG:-ghcr.io/zubairilyas1/civicpulse-backend:latest}
    container_name: civicpulse-backend-prod
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/civicpulse
      REDIS_URL: redis://redis:6379/0
      TRIAGE_PROVIDER: ${TRIAGE_PROVIDER:-simulated}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    networks:
      - edge
      - internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE_TAG:-ghcr.io/zubairilyas1/civicpulse-frontend:latest}
    container_name: civicpulse-frontend-prod
    restart: always
    ports:
      - "80:80"
    networks:
      - edge
    depends_on:
      - backend

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  postgres_data_prod:
  redis_data_prod:
